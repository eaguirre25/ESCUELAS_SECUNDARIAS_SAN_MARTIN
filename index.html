<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Escuelas secundarias · General San Martín</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root{--bg:#07111f;--panel:#0d1b2a;--text:#eef6ff;--muted:#9fb4c8;--line:#263e55;--state:#28b9d6;--private:#e95f8d}
    *{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
    body{display:grid;grid-template-rows:auto 1fr;overflow:hidden}header{display:flex;align-items:center;gap:24px;padding:12px 16px;background:#091827;border-bottom:1px solid var(--line);z-index:1000}
    .title{flex:1;min-width:0}.title h1{font-size:18px;margin:0 0 3px}.title p{font-size:11.5px;color:var(--muted);margin:0}
    .summary{display:flex;gap:18px;align-items:center}.summary div{white-space:nowrap}.summary b{font-size:16px}.summary span{font-size:10px;color:var(--muted);margin-left:4px}
    .legend{display:flex;gap:14px;align-items:center;font-size:11px;color:#c8d9e8;white-space:nowrap}.legend-item{display:flex;align-items:center;gap:6px}.dot{width:11px;height:11px;border-radius:50%}
    #map{width:100%;height:100%;background:#dbe7ef}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--text)}
    .popup h2{font-size:14px;line-height:1.3;margin:0 0 5px}.popup p{font-size:11px;color:#b8cadd;margin:3px 0}.popup strong{color:var(--text)}
    @media(max-width:850px){header{align-items:flex-start;flex-wrap:wrap;gap:8px 16px}.title{flex-basis:100%}.summary{flex:1}.legend{flex-wrap:wrap}body{grid-template-rows:auto minmax(60vh,1fr)}}
  </style>
</head>
<body>
  <header>
    <div class="title"><h1>Escuelas secundarias · General San Martín</h1><p>El tamaño representa la matrícula; el color, el tipo de gestión.</p></div>
    <div class="summary" aria-label="Resumen"><div><b id="schoolCount">0</b><span>escuelas</span></div><div><b id="enrollmentCount">0</b><span>estudiantes</span></div></div>
    <div class="legend" aria-label="Referencias"><div class="legend-item"><span class="dot" style="background:var(--state)"></span>Estatal</div><div class="legend-item"><span class="dot" style="background:var(--private)"></span>Privada</div></div>
  </header>
  <main id="map" aria-label="Mapa de escuelas secundarias"></main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="schools-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
