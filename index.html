<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escuelas secundarias estatales · General San Martín</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--bg:#07111f;--panel:#0d1b2a;--panel2:#10243a;--text:#eef6ff;--muted:#9fb4c8;--line:#263e55;--accent:#48cae4}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}.app{height:100%;display:grid;grid-template-columns:330px 1fr}.sidebar{background:linear-gradient(180deg,#091827,#07111f);border-right:1px solid var(--line);padding:18px;overflow:auto;z-index:1000}.brand h1{font-size:20px;line-height:1.15;margin:0 0 7px}.brand p{font-size:12.5px;color:var(--muted);margin:0 0 15px;line-height:1.45}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 16px}.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:var(--muted)}label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block;margin:12px 0 6px}input,select,button{width:100%;border:1px solid var(--line);background:#0b1b2c;color:var(--text);border-radius:10px;padding:10px 11px;font-size:13px;outline:none}input:focus,select:focus{border-color:var(--accent)}.controls{display:grid;gap:7px}button{cursor:pointer;background:#12304a}button:hover{background:#173d5c}.small{font-size:11px;color:var(--muted);margin-top:13px;line-height:1.4}.legend{margin-top:16px;padding-top:13px;border-top:1px solid var(--line)}.legend-row{display:flex;align-items:center;gap:8px;font-size:12px;margin:6px 0}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}#map{height:100%;width:100%;background:#dbe7ef}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0d1b2a;color:#eef6ff}.leaflet-popup-content{margin:12px 14px;min-width:245px}.pop-title{font-weight:800;font-size:14px;line-height:1.25;margin-bottom:7px}.pop-sub{color:#b8cadd;font-size:12px;margin-bottom:8px}.pop-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.pop-kpi{background:#10243a;border-radius:8px;padding:7px}.pop-kpi b{font-size:15px;display:block}.pop-kpi span{font-size:10px;color:#9fb4c8;text-transform:uppercase;letter-spacing:.04em}.cue{font-size:10px;color:#8aa3b8;margin-top:8px}.school-list{margin-top:14px;display:grid;gap:6px}.school-item{border:1px solid var(--line);background:#0b1b2c;border-radius:9px;padding:9px;cursor:pointer}.school-item:hover{border-color:#3c6a8e}.school-item strong{font-size:12px;display:block;line-height:1.25}.school-item span{font-size:10.5px;color:var(--muted)}@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}.sidebar{max-height:42vh;border-right:0;border-bottom:1px solid var(--line);padding:12px}.brand p,.legend,.small{display:none}.stats{margin:8px 0}#map{min-height:58vh}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><h1>Escuelas secundarias estatales</h1><p>Partido de General San Martín · Matrícula y localización · Anual 2026</p></div>
<div class="stats"><div class="stat"><b id="countSchools">0</b><span>escuelas visibles</span></div><div class="stat"><b id="countStudents">0</b><span>matrícula visible</span></div></div>
<div class="controls"><label for="search">Buscar escuela</label><input id="search" type="search" placeholder="Nombre, número, CUE o localidad"><label for="localidad">Localidad</label><select id="localidad"><option value="">Todas</option></select><label for="categoria">Categoría</label><select id="categoria"><option value="">Todas</option><option>Primera</option><option>Segunda</option><option>Tercera</option><option>S/Datos</option></select><button id="reset" type="button">Restablecer filtros y vista</button></div>
<div class="legend"><div style="font-size:11px;color:var(--muted);margin-bottom:7px">COLOR DEL PUNTO</div><div class="legend-row"><span class="dot" style="background:#48cae4"></span>Primera</div><div class="legend-row"><span class="dot" style="background:#ffd166"></span>Segunda</div><div class="legend-row"><span class="dot" style="background:#ef709d"></span>Tercera</div><div class="legend-row"><span class="dot" style="background:#52b788"></span>Sin datos</div><div class="small">El tamaño del punto representa la matrícula. Hacé clic en una escuela para ver su ficha.</div></div>
<div class="school-list" id="schoolList"></div>
</aside>
<main id="map" aria-label="Mapa de escuelas secundarias estatales de General San Martín"></main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="data1.js"></script><script src="data2.js"></script><script src="data3.js"></script><script src="data4.js"></script><script src="data5.js"></script>
<script>
const schools=window.SCHOOLS||[];const colors={Primera:'#48cae4',Segunda:'#ffd166',Tercera:'#ef709d','S/Datos':'#52b788'};const map=L.map('map',{zoomControl:true});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);const layer=L.layerGroup().addTo(map);const bounds=L.latLngBounds(schools.map(s=>[s.lat,s.lon]));map.fitBounds(bounds.pad(.12));const initialBounds=bounds.pad(.12);const locSel=document.getElementById('localidad');[...new Set(schools.map(s=>s.localidad))].sort((a,b)=>a.localeCompare(b,'es')).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;locSel.appendChild(o)});function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function radius(m){return Math.max(5,Math.min(15,4+Math.sqrt(m)/3.1))}function popup(s){return `<div class="pop-title">${esc(s.nombre)}</div><div class="pop-sub">${esc(s.calle)} ${esc(s.nro)} · ${esc(s.localidad)}</div><div class="pop-grid"><div class="pop-kpi"><b>${s.matricula.toLocaleString('es-AR')}</b><span>Matrícula</span></div><div class="pop-kpi"><b>${s.secciones}</b><span>Secciones</span></div><div class="pop-kpi"><b>${s.varones}</b><span>Varones</span></div><div class="pop-kpi"><b>${s.mujeres}</b><span>Mujeres</span></div></div><div class="cue">CUE ${esc(s.cue)} · Categoría ${esc(s.categoria)}${s.desfavorabilidad==='1'?' · Con desfavorabilidad':''}</div>`}function current(){const q=document.getElementById('search').value.trim().toLowerCase(),loc=locSel.value,cat=document.getElementById('categoria').value;return schools.filter(s=>(`${s.nombre} ${s.cue} ${s.localidad}`).toLowerCase().includes(q)&&(!loc||s.localidad===loc)&&(!cat||s.categoria===cat))}function render(){layer.clearLayers();const list=document.getElementById('schoolList');list.innerHTML='';const arr=current();let total=0;arr.forEach(s=>{total+=s.matricula;const marker=L.circleMarker([s.lat,s.lon],{radius:radius(s.matricula),color:'#06101c',weight:1.3,fillColor:colors[s.categoria]||'#52b788',fillOpacity:.88}).bindPopup(popup(s)).bindTooltip(`${s.nombre} · ${s.matricula} estudiantes`,{direction:'top'}).addTo(layer);const item=document.createElement('div');item.className='school-item';item.innerHTML=`<strong>${esc(s.nombre)}</strong><span>${esc(s.localidad)} · ${s.matricula} estudiantes</span>`;item.addEventListener('click',()=>{map.setView([s.lat,s.lon],16);marker.openPopup()});list.appendChild(item)});document.getElementById('countSchools').textContent=arr.length;document.getElementById('countStudents').textContent=total.toLocaleString('es-AR');if(arr.length&&arr.length<schools.length)map.fitBounds(L.latLngBounds(arr.map(s=>[s.lat,s.lon])).pad(.18),{maxZoom:15})}['search','localidad','categoria'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));document.getElementById('reset').addEventListener('click',()=>{document.getElementById('search').value='';locSel.value='';document.getElementById('categoria').value='';render();map.fitBounds(initialBounds)});render();
</script>
</body></html>
