name: Publicar mapa en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar y habilitar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar sitio
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp sample-enhancement.js _site/sample-enhancement.js
          python - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text()
          s = s.replace("if(q&&!(`${s.nombre} ${s.cue} ${s.localidad} ${s.calle}`).toLowerCase().includes(q)))return;", "if(q && !(`${s.nombre} ${s.cue} ${s.localidad} ${s.calle}`.toLowerCase().includes(q)))return;")
          s = s.replace('</body>', '<script src=\"sample-enhancement.js\"></script>\n</body>')
          p.write_text(s)
          PY

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
